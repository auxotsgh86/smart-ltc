<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>健康站客人手機版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: no reading needed — pictures, colours, faces, big digits, and a voice that speaks
   IDEA: the same meters the elder holds in hand, drawn on screen, with the box to copy lit up
   PICTURE: big device drawings, a giant keypad, a smiling / worried face for the result
   COLOUR and TYPE: pharmacy green, mint, coral; digits 56px+, tiny captions only for family helpers
   LAYOUT: phone column; person chips on top; four icon tabs fixed at bottom */
:root{color-scheme:light dark;
--bg:light-dark(#f4f8f6,#0b1513);--card:light-dark(#fff,#13221f);--ink:light-dark(#10231d,#e6f1ed);--mute:light-dark(#5f736c,#9db3ab);
--brand:light-dark(#0b7a5c,#2fb98f);--soft:light-dark(#e3f1eb,#17322b);--line:light-dark(#d3e4dc,#26443b);
--accent:light-dark(#d9483a,#ff7d68);--yel:light-dark(#d39200,#f2b640);--grn:light-dark(#1f9d55,#4bd685)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none}
.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:112px}
.top{background:var(--brand);padding:12px 14px;display:flex;gap:10px;overflow-x:auto}
.who{flex:none;display:flex;align-items:center;gap:8px;border:3px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:4px 16px 4px 4px;min-height:60px;cursor:pointer;font:700 18px "Noto Sans TC"}
.who.on{background:#fff;color:var(--brand);border-color:#fff}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.cap{font-size:14px;color:var(--mute);text-align:center;margin:2px 0 0}
.devs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.devs button{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:8px 4px 6px;cursor:pointer;color:var(--ink)}
.devs button.on{border-color:var(--brand);background:var(--soft)}
.devs svg{width:100%;height:76px;display:block}
.slotbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:3px solid var(--line);background:var(--card);border-radius:20px;min-height:74px;cursor:pointer;margin-bottom:14px;color:var(--ink);font:900 26px "Noto Sans TC"}
.slotbtn svg{width:48px;height:48px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{border:0;border-radius:24px;min-height:150px;cursor:pointer;display:grid;place-items:center;gap:4px;color:#fff;font:900 22px "Noto Sans TC";padding:12px}
.act svg{width:72px;height:72px}
.act.cam{background:var(--brand)}.act.key{background:var(--card);color:var(--brand);border:3px solid var(--brand)}
button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.meter{display:block;margin:0 auto 6px;width:min(100%,260px);height:auto}
.display{font:900 64px/1 "Noto Sans TC";text-align:center;letter-spacing:4px;min-height:84px;padding:10px;border-radius:18px;background:var(--soft);font-variant-numeric:tabular-nums;margin-bottom:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{border:0;background:var(--card);border:2px solid var(--line);border-radius:18px;min-height:76px;font:900 36px "Noto Sans TC";color:var(--ink);cursor:pointer}
.pad button.ok{background:var(--grn);color:#fff;border-color:var(--grn)}
.pad button.del{color:var(--accent)}
.pad svg{width:40px;height:40px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.yn button{border:0;border-radius:22px;min-height:110px;cursor:pointer;display:grid;place-items:center}
.yn svg{width:64px;height:64px}
.yn .y{background:var(--grn)}.yn .n{background:var(--accent)}
.face{display:block;width:150px;height:150px;margin:4px auto}
.big{font:900 64px/1.05 "Noto Sans TC";text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.sub{font:900 30px "Noto Sans TC";text-align:center;color:var(--mute)}
.say{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto 0;border:0;background:var(--soft);color:var(--brand);border-radius:999px;min-height:64px;padding:0 26px;cursor:pointer;font:900 22px "Noto Sans TC"}
.say svg{width:36px;height:36px}
.timer{font:900 96px/1 "Noto Sans TC";text-align:center;color:var(--brand);font-variant-numeric:tabular-nums}
.ring{display:block;margin:0 auto;width:200px;height:200px}
.week{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:5px;align-items:center;text-align:center;font-size:15px}
.week .c{height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.week .c.y{background:var(--brand)}
.week .c svg{width:24px;height:24px}
.week .ic svg{width:30px;height:30px}
.fig{position:relative;min-height:220px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;justify-content:center;gap:22px;font-size:15px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}.legend svg{width:30px;height:30px}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dots i{width:30px;height:30px;border-radius:50%;border:3px solid var(--line)}
.dots i.y{background:var(--brand);border-color:var(--brand)}
.gifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gifts div{border-radius:16px;background:var(--soft);padding:8px 4px;text-align:center}
.gifts svg{width:100%;height:70px}
.gifts .lock{opacity:.4}
.qr{text-align:center}.qr svg.code{width:min(80vw,300px);height:auto;background:#fff;border-radius:18px;padding:14px}
.no{font:900 40px "Noto Sans TC";letter-spacing:4px}
.loading{display:grid;place-items:center;min-height:300px}
.spin{width:90px;height:90px;border-radius:50%;border:10px solid var(--soft);border-top-color:var(--brand);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.photoPrev{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-bottom:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.tabs div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:480px}
.tabs button{border:0;background:none;color:var(--mute);font:700 13px "Noto Sans TC";padding:8px 0 10px;min-height:82px;cursor:pointer;display:grid;justify-items:center;gap:0}
.tabs button svg{width:42px;height:42px}
.tabs button.on{color:var(--brand)}
.demo{font-size:13px;color:var(--mute);text-align:center;margin-top:6px}
</style></head>
<body>
<div class="app">
  <div class="top" id="who"></div>
  <main id="view"></main>
  <p class="demo">原型示範・資料皆為虛構・小字只給家人和藥師看<br><button id="modeBtn" style="margin-top:6px;border:1px solid var(--line);background:var(--card);color:var(--brand);font:700 14px 'Noto Sans TC';border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer"></button></p>
</div>
<nav class="tabs"><div id="tabs">
  <button data-t="entry"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><rect x="8" y="14" width="32" height="26" rx="5"/><circle cx="24" cy="27" r="7"/><path d="M17 14l3-5h8l3 5"/></svg>記錄</button>
  <button data-t="trend"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 36l11-12 8 7 17-18"/><path d="M34 13h8v8"/></svg>變化</button>
  <button data-t="points"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"><rect x="8" y="20" width="32" height="20" rx="3"/><path d="M6 14h36v6H6zM24 14v26M24 14c-4-8-12-6-10-1 1 2 6 1 10 1zM24 14c4-8 12-6 10-1-1 2-6 1-10 1z"/></svg>禮物</button>
  <button data-t="card"><svg viewBox="0 0 48 48" fill="currentColor"><rect x="8" y="8" width="13" height="13" rx="2"/><rect x="27" y="8" width="13" height="13" rx="2"/><rect x="8" y="27" width="13" height="13" rx="2"/><rect x="28" y="28" width="5" height="5"/><rect x="35" y="35" width="5" height="5"/><rect x="28" y="35" width="5" height="5"/></svg>會員碼</button>
</div></nav>

<script>
{
const T=new Date();const D0=new Date(T);D0.setHours(0,0,0,0);
const dayOff=o=>{const x=new Date(D0);x.setDate(x.getDate()-o);return x};
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const same=(a,b)=>a.toDateString()==b.toDateString();
let seed=5;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const people=[{id:'me',name:'王美華',sh:'美',c:'#c2557a',no:'000101',bp:[138,86]},{id:'hus',name:'王大同',sh:'同',c:'#3b6fb6',no:'000107',bp:[146,90]}];
const data={};
people.forEach(p=>{const r=data[p.id]=[];
 for(let o=60;o>=1;o--){const d=dayOff(o),k=(60-o)/60;
  ['am','pm'].forEach(s=>{if(rnd()<.7){const t=new Date(d);t.setHours(s=='am'?7:21);r.push({type:'bp',place:'home',d:t,slot:s,sys:Math.round(p.bp[0]-6*k+rnd()*8-4),dia:Math.round(p.bp[1]-3*k+rnd()*6-3)})}});
  if(o%3==0)r.push({type:'body',place:'home',d,wt:+(61.5-1.2*k+rnd()*.6).toFixed(1)});
  if(rnd()<.17){const t=new Date(d);t.setHours(15);r.push({type:'bp',place:'store',d:t,sys:Math.round(p.bp[0]+6-6*k+rnd()*8-4),dia:Math.round(p.bp[1]+3+rnd()*6-3)})}
 }});

/* ---------- pictures ---------- */
const IC={
 sun:`<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="10" fill="#f2b23a"/><g stroke="#f2b23a" stroke-width="4" stroke-linecap="round"><path d="M24 4v5M24 39v5M4 24h5M39 24h5M10 10l3.5 3.5M34.5 34.5L38 38M10 38l3.5-3.5M34.5 13.5L38 10"/></g></svg>`,
 moon:`<svg viewBox="0 0 48 48"><path d="M30 6a18 18 0 1 0 12 30A15 15 0 0 1 30 6z" fill="#5a6fc4"/><circle cx="12" cy="12" r="2" fill="#5a6fc4"/><circle cx="40" cy="14" r="1.6" fill="#5a6fc4"/></svg>`,
 check:`<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 25l9 9 19-20"/></svg>`,
 cross:`<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"><path d="M13 13l22 22M35 13L13 35"/></svg>`,
 back:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M30 12H18L6 24l12 12h12a8 8 0 0 0 8-8v-8a8 8 0 0 0-8-8z"/><path d="M20 19l10 10M30 19L20 29"/></svg>`,
 speak:`<svg viewBox="0 0 48 48" fill="currentColor"><path d="M8 18h8l11-9v30l-11-9H8z"/><path d="M33 16a11 11 0 0 1 0 16M37 11a17 17 0 0 1 0 26" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>`,
 cam:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><rect x="5" y="13" width="38" height="28" rx="6"/><circle cx="24" cy="27" r="8"/><path d="M16 13l3-6h10l3 6"/></svg>`,
 key:`<svg viewBox="0 0 48 48" fill="currentColor">${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${7+c*13}" y="${7+r*13}" width="9" height="9" rx="2"/>`).join('')).join('')}</svg>`,
 home:`<svg viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linejoin="round"><path d="M6 24L24 8l18 16M11 20v20h26V20"/><rect x="20" y="28" width="8" height="12"/></svg>`,
 shop:`<svg viewBox="0 0 48 48"><rect x="6" y="16" width="36" height="26" rx="3" fill="var(--accent)"/><path d="M4 16l5-9h30l5 9z" fill="var(--accent)" opacity=".7"/><rect x="15" y="25" width="18" height="9" rx="4.5" fill="#fff" transform="rotate(-30 24 29.5)"/></svg>`};
function dev(k,hl){/* hl: which display box to light up */const box=(x,y,w,h,on)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${on?'#ffe08a':'#cfe3da'}" stroke="${on?'#e07a00':'#8fb3a5'}" stroke-width="${on?4:2}"/>`;
 if(k=='bp')return `<svg viewBox="0 0 120 90" class="meter"><rect x="10" y="6" width="100" height="78" rx="14" fill="#f7faf9" stroke="#9fb8ae" stroke-width="3"/>${box(28,14,64,26,hl==1)}${box(28,44,64,22,hl==2)}<circle cx="60" cy="76" r="5" fill="#0b7a5c"/>${hl==1?'<text x="60" y="34" text-anchor="middle" font-size="18" font-weight="900" fill="#a14b00">▲</text>':''}${hl==2?'<text x="60" y="61" text-anchor="middle" font-size="16" font-weight="900" fill="#a14b00">▼</text>':''}</svg>`;
 if(k=='glu')return `<svg viewBox="0 0 120 90" class="meter"><rect x="34" y="4" width="52" height="80" rx="12" fill="#f7faf9" stroke="#9fb8ae" stroke-width="3"/>${box(42,14,36,28,hl==1)}<rect x="54" y="78" width="12" height="12" fill="#e9eef0" stroke="#9fb8ae"/><circle cx="60" cy="58" r="6" fill="#0b7a5c"/></svg>`;
 return `<svg viewBox="0 0 120 90" class="meter"><rect x="8" y="22" width="104" height="60" rx="14" fill="#f7faf9" stroke="#9fb8ae" stroke-width="3"/>${box(38,32,44,20,hl==1)}<path d="M22 70h16M82 70h16" stroke="#9fb8ae" stroke-width="5" stroke-linecap="round"/></svg>`}
function face(c){const col={g:'var(--grn)',y:'var(--yel)',r:'var(--accent)'}[c];
 const m={g:'M30 62q20 18 40 0',y:'M32 66h36',r:'M30 70q20-16 40 0'}[c];
 return `<svg viewBox="0 0 100 100" class="face"><circle cx="50" cy="50" r="46" fill="${col}"/><circle cx="35" cy="40" r="6" fill="#fff"/><circle cx="65" cy="40" r="6" fill="#fff"/><path d="${m}" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></svg>`}
const giftPic=[`<svg viewBox="0 0 80 70"><rect x="8" y="24" width="64" height="38" rx="5" fill="#8fc7e8"/><path d="M30 24q10-18 20 0" fill="#fff" stroke="#bcd" stroke-width="2"/><rect x="8" y="40" width="64" height="5" fill="#fff" opacity=".6"/></svg>`,
 `<svg viewBox="0 0 80 70"><rect x="20" y="10" width="40" height="54" rx="6" fill="#f3c96b"/><rect x="20" y="24" width="40" height="18" fill="#fff" opacity=".7"/><circle cx="40" cy="33" r="6" fill="#e48f2a"/></svg>`,
 `<svg viewBox="0 0 80 70"><rect x="18" y="30" width="44" height="32" rx="8" fill="#f2b8c6"/><rect x="22" y="18" width="36" height="14" rx="5" fill="#d98aa0"/><circle cx="40" cy="46" r="7" fill="#fff" opacity=".7"/></svg>`];

/* ---------- state ---------- */
const $=s=>document.querySelector(s);
let mode='self',who='me',tab='entry',type='bp',slot=T.getHours()<14?'am':'pm',stage='choose',box=1,digits='',vals={},first=null,last=null,photo=null,timer=null,left=60,range=30;
const R=()=>data[who],P=()=>people.find(p=>p.id==who);
const lightBP=(s,d)=>s>=140||d>=90?'r':s>=130||d>=80?'y':'g';
const lightGlu=v=>v>=126?'r':v>=100?'y':'g';
const VOICE={bp:{g:'血壓很好，繼續保持。',y:'血壓有一點高，記得少吃鹹，按時吃藥。',r:'血壓偏高。先坐著休息，等一下再量一次。如果還是很高，請來藥局找藥師。'},
 glu:{g:'血糖很好。',y:'血糖有一點高，甜的少吃一點。',r:'血糖偏高，請回診給醫師看。'},body:'體重記好了。'};
function say(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function avg7(){const from=dayOff(7),g={};R().filter(r=>r.type=='bp'&&r.place=='home'&&r.d>=from).forEach(r=>{const k=r.d.toDateString()+r.slot;(g[k]=g[k]||[]).push(r)});
 const a=Object.values(g).map(l=>[l.reduce((s,r)=>s+r.sys,0)/l.length,l.reduce((s,r)=>s+r.dia,0)/l.length]);if(!a.length)return null;
 return{sys:Math.round(a.reduce((s,x)=>s+x[0],0)/a.length),dia:Math.round(a.reduce((s,x)=>s+x[1],0)/a.length)}}
function weekGrid(){const days=[];for(let i=6;i>=0;i--)days.push(dayOff(i));const has=(d,s)=>R().some(r=>r.type=='bp'&&r.place=='home'&&r.slot==s&&same(r.d,d));
 return `<div class="week"><span></span>${days.map(d=>`<span style="color:var(--mute)">${d.getDate()}</span>`).join('')}
 ${['am','pm'].map(s=>`<span class="ic">${IC[s=='am'?'sun':'moon']}</span>`+days.map(d=>`<span class="c ${has(d,s)?'y':''}">${has(d,s)?IC.check:''}</span>`).join('')).join('')}</div>`}
const NEED={bp:[1,2],glu:[1],body:[1]};

/* ---------- screens ---------- */
function vEntry(){
 if(stage=='choose')return `
  <div class="devs">${['bp','glu','body'].map(k=>`<button data-type="${k}" class="${type==k?'on':''}" aria-label="${{bp:'血壓計',glu:'血糖機',body:'體重計'}[k]}">${dev(k,0)}<p class="cap">${{bp:'血壓',glu:'血糖',body:'體重'}[k]}</p></button>`).join('')}</div>
  ${type=='bp'?`<button class="slotbtn" data-act="slot" aria-label="早上或晚上">${IC[slot=='am'?'sun':'moon']}${slot=='am'?'早上':'晚上'}</button>`:''}
  <div class="two"><label class="act cam" aria-label="拍照">${IC.cam}<span>拍照</span><input type="file" accept="image/*" capture="environment" id="ph" style="position:absolute;opacity:0;width:1px;height:1px"></label>
   <button class="act key" data-act="keypad" aria-label="按數字">${IC.key}<span>按數字</span></button></div>
  ${type=='bp'?`<div class="card" style="margin-top:14px">${weekGrid()}<p class="cap">早晚都打勾最好（每次量 2 遍）</p></div>`:''}`;
 if(stage=='reading')return `<div class="card loading"><div><div class="spin"></div><p class="cap" style="margin-top:14px">AI 正在看照片上的數字…</p></div></div>`;
 if(stage=='keypad')return `<div class="card">${dev(type,box)}<div class="display" id="disp">${digits||'&nbsp;'}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-d="${n}">${n}</button>`).join('')}<button class="del" data-d="del" aria-label="刪除">${IC.back}</button><button data-d="0">0</button>${type=='body'?'<button data-d=".">.</button>':`<button class="ok" data-d="ok" aria-label="好了">${IC.check}</button>`}</div>
  ${type=='body'?`<button class="act" style="background:var(--grn);min-height:80px;width:100%;margin-top:10px" data-d="ok" aria-label="好了">${IC.check}</button>`:''}</div>`;
 if(stage=='confirm'){const show=type=='bp'?`${vals[1]}<span style="color:var(--mute)">/</span>${vals[2]}`:vals[1];
  return `<div class="card">${photo?`<img class="photoPrev" src="${photo}" alt="拍的照片">`:''}${dev(type,0)}<div class="big">${show}</div>
   <p class="cap">數字對嗎？</p><div class="yn"><button class="y" data-act="yes" aria-label="對">${IC.check}</button><button class="n" data-act="no" aria-label="不對，重來">${IC.cross}</button></div></div>`}
 if(stage=='rest')return `<div class="card"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--soft)" stroke-width="10"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="var(--brand)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="${276.5*(1-left/60)}" transform="rotate(-90 50 50)"/><text id="timer" x="50" y="60" text-anchor="middle" font-size="30" font-weight="900" fill="var(--brand)">${left}</text></svg>
  <p class="cap" style="font-size:16px">坐著休息，等圈圈走完再量第 2 遍</p>
  <div class="yn"><button class="y" data-act="r2" style="grid-column:1/3" aria-label="量第二次">${IC.check}</button></div></div>`;
 if(stage=='done'){const r=last,c=r.type=='bp'?lightBP(r.sys,r.dia):r.type=='glu'?lightGlu(r.val):'g';
  return `<div class="card">${face(c)}<div class="big">${r.type=='bp'?`${r.sys}/${r.dia}`:r.type=='glu'?r.val:r.wt}</div>
   <button class="say" data-act="say">${IC.speak}再聽一次</button>
   <p class="cap">${r.type=='bp'?'兩遍平均・':''}已傳給藥局${photo?'・有照片給藥師核對':''}</p></div>
   ${r.type=='bp'?`<div class="card">${weekGrid()}</div>`:''}
   <div class="yn"><button class="y" data-act="again" style="grid-column:1/3;background:var(--brand)" aria-label="完成">${IC.check}</button></div>`}}

function vTrend(){const a=avg7(),c=a&&lightBP(a.sys,a.dia),st=R().filter(r=>r.type=='bp'&&r.place=='store').pop();
 return `<div class="card">${a?`${face(c)}<div class="big">${a.sys}/${a.dia}</div><p class="cap">在家 7 天平均血壓</p>
   <button class="say" data-act="sayTrend">${IC.speak}聽說明</button>`:'<p>還沒有資料</p>'}</div>
 <div class="two" style="margin-bottom:14px">${[30,90].map(n=>`<button class="act ${range==n?'cam':'key'}" style="min-height:70px" data-rg="${n}">${n} 天</button>`).join('')}</div>
 <div class="card"><div class="legend"><span>${IC.home}在家</span><span>${IC.shop}藥局</span></div><div class="fig" data-ch="bp"><svg></svg></div><p class="cap">紅色虛線以下比較好</p></div>`}

function vPoints(){const cnt=R().filter(r=>r.place=='store'&&r.type=='bp'&&r.d.getMonth()==T.getMonth()).length,need=8;
 return `<div class="card"><div style="display:flex;justify-content:center;margin-bottom:8px">${IC.shop.replace('<svg','<svg width="70" height="70"')}</div>
  <div class="dots">${Array.from({length:need},(_,i)=>`<i class="${i<cnt?'y':''}"></i>`).join('')}</div>
  <div class="big" style="font-size:48px;margin-top:8px">${cnt} / ${need}</div><p class="cap">這個月來藥局量血壓（血糖、體重也要各 4 次）</p></div>
 <div class="card"><div class="gifts">${giftPic.map((g,i)=>`<div class="${cnt>=need?'':'lock'}">${g}<p class="cap">${['面紙','益生菌','保養品'][i]}${i==2?'・連續 3 個月':''}</p></div>`).join('')}</div>
  <p class="cap">集滿就到藥局換一個</p></div>
 <button class="say" data-act="sayPts" style="width:100%">${IC.speak}聽說明</button>`}

function vCard(){return `<div class="card qr"><div class="av" style="background:${P().c};margin:0 auto 8px;width:64px;height:64px;font-size:30px">${P().sh}</div>${qr(P().no)}<div class="no">${P().no}</div><p class="cap">到藥局時給藥師掃</p></div>`}

function qr(txt){let h=0;for(const ch of txt)h=(h*31+ch.charCodeAt(0))>>>0;let s=h||7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 let o='';const N=21,fz=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!fz(x,y)&&r()<.5)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
 const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 return `<svg class="code" viewBox="0 0 21 21" fill="#10231d" shape-rendering="crispEdges" aria-label="會員 QR Code 示意">${o}${f(0,0)}${f(14,0)}${f(0,14)}</svg>`}

let ro;
function chart(el){const svg=el.querySelector('svg'),from=dayOff(range),rs=R().filter(r=>r.type=='bp'&&r.d>=from);const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;
 const ys=rs.map(r=>r.sys).concat([130]);let lo=Math.min(...ys)-4,hi=Math.max(...ys)+4;
 const L=36,Rr=8,Tp=8,B=24,x=d=>L+(W-L-Rr)*(d-from)/(T-from),y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));let g='';
 [lo+4,130,hi-4].forEach(v=>g+=`<text x="${L-6}" y="${y(v)+5}" text-anchor="end" font-size="13" fill="var(--mute)">${Math.round(v)}</text>`);
 g+=`<rect x="${L}" y="${y(130)}" width="${W-L-Rr}" height="${H-B-y(130)}" fill="var(--grn)" opacity=".08"/><line x1="${L}" x2="${W-Rr}" y1="${y(130)}" y2="${y(130)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>`;
 [from,T].forEach((d,i)=>g+=`<text x="${x(d)}" y="${H-5}" text-anchor="${i?'end':'start'}" font-size="13" fill="var(--mute)">${md(d)}</text>`);
 const by={};rs.filter(r=>r.place=='home').forEach(r=>{const k=r.d.toDateString();(by[k]=by[k]||[]).push(r)});
 g+=`<polyline fill="none" stroke="var(--brand)" stroke-width="3" points="${Object.values(by).map(l=>x(new Date(l[0].d.toDateString()))+','+y(l.reduce((s,r)=>s+r.sys,0)/l.length)).join(' ')}"/>`;
 g+=rs.filter(r=>r.place=='store').map(r=>`<rect x="${x(r.d)-6}" y="${y(r.sys)-6}" width="12" height="12" rx="2" fill="var(--accent)"/>`).join('');
 svg.innerHTML=g}

function render(){
 $('#who').innerHTML=mode=='self'?`<div class="who on" style="cursor:default"><span class="av" style="background:${P().c}">${P().sh}</span>${P().name}</div>`:`<span style="color:#fff;font-size:14px;align-self:center;flex:none">幫誰記錄</span>`+people.map(p=>`<button class="who ${who==p.id?'on':''}" data-who="${p.id}"><span class="av" style="background:${p.c}">${p.sh}</span>${p.name}</button>`).join('');
 $('#modeBtn').textContent=mode=='self'?'示範：換成「子女的手機」（綁定爸媽兩人）':'示範：換回「長輩自己的手機」';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#view').innerHTML={entry:vEntry,trend:vTrend,points:vPoints,card:vCard}[tab]();
 if(ro)ro.disconnect();const figs=document.querySelectorAll('.fig');if(figs.length){ro=new ResizeObserver(()=>figs.forEach(chart));figs.forEach(f=>ro.observe(f))}}
function reset(){stage='choose';box=1;digits='';vals={};first=null;photo=null;clearInterval(timer)}
function go(t){tab=t;if(t=='entry'&&stage=='done')reset();render();window.scrollTo({top:0})}
function fake(){const l=R().filter(r=>r.type==type&&r.place=='home').pop(),j=n=>Math.round((rnd()-.5)*n);
 return type=='bp'?{1:(l?l.sys:132)+j(10),2:(l?l.dia:82)+j(6)}:type=='glu'?{1:104+j(16)}:{1:(l?l.wt:61)}}
function commit(){const now=new Date(),R0=data[who];
 if(type=='bp'){R0.push({type:'bp',place:'home',d:now,slot,sys:vals[1],dia:vals[2]});
  if(!first){first={...vals};stage='rest';left=60;render();say('第一遍記好了。坐著休息一分鐘，再量第二遍。');
   timer=setInterval(()=>{left--;const t=$('#timer'),a=$('#arc');if(t)t.textContent=Math.max(0,left);if(a)a.setAttribute('stroke-dashoffset',276.5*(1-Math.max(0,left)/60));if(left<=0){clearInterval(timer);say('可以量第二遍了。')}},1000);return}
  last={type:'bp',sys:Math.round((first[1]+vals[1])/2),dia:Math.round((first[2]+vals[2])/2)}}
 else if(type=='glu'){R0.push({type:'glu',place:'home',d:now,val:vals[1]});last={type:'glu',val:vals[1]}}
 else{R0.push({type:'body',place:'home',d:now,wt:vals[1]});last={type:'body',wt:vals[1]}}
 stage='done';render();window.scrollTo({top:0});speakResult()}
function speakResult(){const r=last;if(r.type=='bp')say(`血壓 ${r.sys}，${r.dia}。`+VOICE.bp[lightBP(r.sys,r.dia)]);else if(r.type=='glu')say(`血糖 ${r.val}。`+VOICE.glu[lightGlu(r.val)]);else say(`體重 ${r.wt} 公斤。`+VOICE.body)}

document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let el;
 if(el=q('[data-t]'))return go(el.dataset.t);
 if(q('#modeBtn')){mode=mode=='self'?'family':'self';who='me';reset();return render()}
 if(el=q('[data-who]')){who=el.dataset.who;reset();return render()}
 if(el=q('[data-type]')){type=el.dataset.type;reset();return render()}
 if(el=q('[data-rg]')){range=+el.dataset.rg;return render()}
 if(el=q('[data-d]')){const d=el.dataset.d;
  if(d=='del')digits=digits.slice(0,-1);
  else if(d=='ok'){if(!digits)return;vals[box]=+digits;digits='';if(box<NEED[type].length){box++;render();say('現在按下面那個數字。');return}stage='confirm';render();return}
  else if(digits.length<5&&!(d=='.'&&digits.includes('.')))digits+=d;
  const disp=$('#disp');if(disp)disp.innerHTML=digits||'&nbsp;';return}
 if(!(el=q('[data-act]')))return;const a=el.dataset.act;
 if(a=='slot'){slot=slot=='am'?'pm':'am';render()}
 else if(a=='keypad'){stage='keypad';box=1;digits='';render();say(type=='bp'?'按血壓計上面那個大的數字。':'按機器上的數字。')}
 else if(a=='yes')commit();
 else if(a=='no'){const p=!!photo;stage=p?'choose':'keypad';box=1;digits='';vals={};photo=null;render()}
 else if(a=='r2'){clearInterval(timer);stage='choose';vals={};photo=null;render();say('量好第二遍，再拍照或按數字。')}
 else if(a=='again'){reset();render()}
 else if(a=='say')speakResult();
 else if(a=='sayTrend'){const v=avg7();if(v)say(`最近七天在家量的血壓，平均是 ${v.sys}，${v.dia}。`+VOICE.bp[lightBP(v.sys,v.dia)])}
 else if(a=='sayPts'){const cnt=R().filter(r=>r.place=='store'&&r.type=='bp'&&r.d.getMonth()==T.getMonth()).length;say(`這個月來藥局量血壓 ${cnt} 次，量滿 8 次，就可以換禮物。`)}
});
document.addEventListener('change',e=>{if(e.target.id!='ph')return;const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{photo=rd.result;stage='reading';render();setTimeout(()=>{vals=fake();stage='confirm';render();say(type=='bp'?`看到的是 ${vals[1]}，${vals[2]}。對的話按綠色。`:`看到的是 ${vals[1]}。對的話按綠色。`)},1500)};rd.readAsDataURL(f)});
render();
}
</script>
</body>
</html>
